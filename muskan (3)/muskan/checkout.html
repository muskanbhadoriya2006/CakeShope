<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Checkout</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="checkout.css">

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body>

<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-expand-lg">

    <div class="container-fluid" id="suru">

        <a class="navbar-brand" id="log" href="index.html">
            <img src="logo.png" alt="logo">
        </a>

        <button class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent">

            <span class="navbar-toggler-icon"></span>

        </button>


        <div class="collapse navbar-collapse" id="navbarSupportedContent">

            <ul class="navbar-nav mx-auto mb-2 mb-lg-0">

                <li class="nav-item">
                    <a class="nav-link" href="index.html">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="About.html">About</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="Cakes.html">Cakes</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="Testimonials.html">
                        Testimonials
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="contact.html">
                        Contact
                    </a>
                </li>

            </ul>


            <!-- CART -->

            <div class="position-relative d-inline-block">

                <button class="btn border-0"
                    onclick="window.location.href='cart.html'">

                    <span id="cartTotal"
                        class="fs-5 text-primary">
                        $0.00
                    </span>

                    <i class="bi bi-basket fs-3 text-primary ms-3"></i>

                </button>

                <span id="cartCount"
                    class="position-absolute top-0 end-0
                    translate-middle badge rounded-pill bg-primary">

                    0

                </span>

            </div>

        </div>

    </div>

</nav>


<!-- ================= CHECKOUT ================= -->

<section class="checkout-page">

    <div class="container">

        <h1 class="checkout-title">
            Checkout
        </h1>


        <div class="checkout-layout">


            <!-- =================
                 BILLING DETAILS
            ================= -->

            <div class="billing-box">

                <h2>
                    Billing Details
                </h2>


                <form id="checkoutForm">

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label>
                                First Name *
                            </label>

                            <input type="text"
                                class="form-control"
                                required>

                        </div>


                        <div class="col-md-6 mb-3">

                            <label>
                                Last Name *
                            </label>

                            <input type="text"
                                class="form-control"
                                required>

                        </div>


                        <div class="col-12 mb-3">

                            <label>
                                Email *
                            </label>

                            <input type="email"
                                class="form-control"
                                required>

                        </div>


                        <div class="col-12 mb-3">

                            <label>
                                Phone *
                            </label>

                            <input type="tel"
                                class="form-control"
                                required>

                        </div>


                        <div class="col-12 mb-3">

                            <label>
                                Address *
                            </label>

                            <input type="text"
                                class="form-control"
                                required>

                        </div>


                        <div class="col-md-6 mb-3">

                            <label>
                                City *
                            </label>

                            <input type="text"
                                class="form-control"
                                required>

                        </div>


                        <div class="col-md-6 mb-3">

                            <label>
                                Pincode *
                            </label>

                            <input type="text"
                                class="form-control"
                                required>

                        </div>


                        <div class="col-12 mb-3">

                            <label>
                                Order Notes
                            </label>

                            <textarea
                                class="form-control"
                                rows="4">
                            </textarea>

                        </div>

                    </div>

                </form>

            </div>


            <!-- =================
                 YOUR ORDER
            ================= -->

            <div class="order-box">

                <h2>
                    Your Order
                </h2>


                <!-- Products JS se -->

                <div id="checkoutItems">

                </div>


                <div class="order-row">

                    <span>
                        Subtotal
                    </span>

                    <strong id="checkoutSubtotal">
                        $0.00
                    </strong>

                </div>


                <div class="order-row total-row">

                    <span>
                        Total
                    </span>

                    <strong id="checkoutTotal">
                        $0.00
                    </strong>

                </div>


                <button
                    type="submit"
                    form="checkoutForm"
                    class="place-order-btn">

                    Place Order

                </button>

            </div>

        </div>

    </div>

</section>


<script src="code.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
