<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Shopping Cart</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="cart.css">

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body>

<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-expand-lg">

    <div class="container-fluid" id="suru">

        <a class="navbar-brand" id="log" href="index.html">
            <img src="logo.png" alt="logo">
        </a>

        <button class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent">

            <span class="navbar-toggler-icon"></span>

        </button>


        <div class="collapse navbar-collapse" id="navbarSupportedContent">

            <ul class="navbar-nav mx-auto mb-2 mb-lg-0">

                <li class="nav-item">
                    <a class="nav-link" href="index.html">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="About.html">About</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="Cakes.html">Cakes</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="Testimonials.html">Testimonials</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="contact.html">Contact</a>
                </li>

            </ul>


            <!-- CART -->

            <div class="position-relative d-inline-block">

                <button class="btn border-0"
                    onclick="window.location.href='cart.html'">

                    <span id="cartTotal"
                        class="fs-5 text-primary">
                        $0.00
                    </span>

                    <i class="bi bi-basket fs-3 text-primary ms-3"></i>

                </button>

                <span id="cartCount"
                    class="position-absolute top-0 end-0
                    translate-middle badge rounded-pill bg-primary">

                    0

                </span>

            </div>

        </div>

    </div>

</nav>


<!-- ================= CART PAGE ================= -->

<section class="cart-page">

    <div class="container">

        <h1 class="cart-title">
            Shopping Cart
        </h1>


        <div class="cart-layout">

            <!-- LEFT SIDE -->

            <div class="cart-products">

                <div class="cart-heading">

                    <span>Product</span>
                    <span>Price</span>
                    <span>Quantity</span>
                    <span>Subtotal</span>

                </div>


                <!-- Products yaha JS se aayenge -->

                <div id="cartPageItems">

                </div>

            </div>


            <!-- RIGHT SIDE -->

            <div class="cart-summary">

                <h2>Cart totals</h2>

                <div class="summary-row">

                    <span>Subtotal</span>

                    <strong id="pageSubtotal">
                        $0.00
                    </strong>

                </div>


                <div class="summary-row">

                    <span>Total</span>

                    <strong id="pageTotal">
                        $0.00
                    </strong>

                </div>


                <button class="checkout-btn"
                    onclick="goToCheckout()">

                    Proceed to Checkout

                </button>

            </div>

        </div>

    </div>

</section>


<script src="code.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
